<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | WebTestPro</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">WebTest<span>Pro</span></a><nav><a href="index.html">Home</a><a href="login.html">Log in</a></nav></header><main class="form-wrap"><section class="form-card"><div class="eyebrow">GET STARTED</div><h1>Create your account</h1><p class="muted">A local demo profile, ready to test.</p><form id="register-form" novalidate><label for="name">Full name</label><input id="name" name="name" autocomplete="name" placeholder="Your name"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter password again"><div class="message" role="alert" aria-live="polite"></div><button class="button full" type="submit">Create account</button></form><p class="muted center">Already have an account? <a href="login.html">Log in</a></p></section></main><script src="script.js"></script></body></html>
